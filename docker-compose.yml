# Real-time fraud-detection MLOps platform - 100 % open source.
#   docker compose up -d --build
name: fraud-mlops

x-app: &app
  build: {context: ., dockerfile: docker/app.Dockerfile}
  image: fraud-mlops-app:latest
  restart: unless-stopped
  environment: &app-env
    MLFLOW_TRACKING_URI: http://mlflow:5000
    DATABASE_URL: postgresql+psycopg2://mlops:mlops@postgres:5432/fraud
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP: kafka:9092
    API_URL: http://api:8000
    EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-20}
    AUTO_RETRAIN: ${AUTO_RETRAIN:-true}
    MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
    MODEL_POLL_SECONDS: "15"

services:
  # ------------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: mlops, POSTGRES_PASSWORD: mlops, POSTGRES_DB: mlflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d fraud || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped

  kafka:                       # Apache Kafka in KRaft mode (no ZooKeeper)
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 2
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: {kafka: {condition: service_healthy}}
    restart: unless-stopped

  mlflow:                      # experiment tracking + model registry (artifacts proxied to a volume)
    build: {context: ., dockerfile: docker/mlflow.Dockerfile}
    image: fraud-mlops-mlflow:latest
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://mlops:mlops@postgres:5432/mlflow
      --artifacts-destination /mlartifacts --serve-artifacts
    ports: ["5000:5000"]
    volumes: ["mlartifacts:/mlartifacts"]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fraud-mlops.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  # ------------------------------------------------------------------ ML services
  init-train:                  # one-shot: trains + registers the first champion (idempotent)
    <<: *app
    command: ["python", "-m", "src.training.train", "--bootstrap"]
    restart: "no"
    depends_on:
      mlflow: {condition: service_healthy}

  api:                         # real-time scoring service
    <<: *app
    command: ["uvicorn", "src.serving.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      init-train: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  processor:                   # Kafka consumer -> API -> Kafka + Postgres
    <<: *app
    command: ["python", "-m", "src.streaming.processor"]
    depends_on:
      api: {condition: service_healthy}
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}

  producer:                    # transaction simulator -> Kafka
    <<: *app
    command: ["python", "-m", "src.streaming.producer"]
    depends_on:
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}

  monitor:                     # Evidently drift + live performance + auto-retrain
    <<: *app
    command: ["python", "-m", "src.monitoring.drift_monitor"]
    user: root                 # bind-mounted ./reports must be writable on any host OS
    volumes: ["./reports:/app/reports"]
    depends_on:
      init-train: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}

volumes:
  pgdata:
  mlartifacts:
  promdata:
  grafanadata:
